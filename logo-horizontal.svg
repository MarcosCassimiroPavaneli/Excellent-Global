<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .eg-blue { fill: #1D5382; }
      .eg-white { fill: #FFFFFF; }
      .eg-text-main { font-family: 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; font-style: italic; }
      .eg-text-sub { font-family: 'Montserrat', 'Arial', sans-serif; font-weight: 500; font-style: italic; }
    </style>
  </defs>

  <!-- Símbolo / Globo na Esquerda -->
  <g transform="translate(140, 140)">
    <!-- Círculo Base Azul -->
    <circle cx="0" cy="0" r="125" class="eg-blue" />
    
    <!-- Corte Horizontal Branco -->
    <rect x="-130" y="-6" width="260" height="12" class="eg-white" />
    
    <!-- Arco Interno Branco Superior -->
    <path d="M -85 -6 A 95 95 0 0 1 95 -6 L 82 -6 A 82 82 0 0 0 -72 -6 Z" class="eg-white" />
    
    <!-- Arco Interno Branco Inferior -->
    <path d="M -85 6 A 95 95 0 0 0 95 6 L 82 6 A 82 82 0 0 1 -72 6 Z" class="eg-white" />

    <!-- Núcleo Central Azul (Hemisfério Superior) -->
    <path d="M -72 -6 A 82 82 0 0 1 82 -6 Z" class="eg-blue" />

    <!-- Núcleo Central Azul (Hemisfério Inferior) -->
    <path d="M -72 6 A 82 82 0 0 0 82 6 Z" class="eg-blue" />
  </g>

  <!-- Tipografia: excellent global ® -->
  <text x="310" y="160" class="eg-blue eg-text-main" font-size="94" letter-spacing="-3">
    excellent global<tspan font-size="40" dy="-38">®</tspan>
  </text>

  <!-- Tipografia: idiomas -->
  <text x="810" y="240" class="eg-blue eg-text-sub" font-size="74" letter-spacing="0">
    idiomas
  </text>
</svg>
