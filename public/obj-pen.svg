<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="penShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bodyBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#073660"/>
      <stop offset="35%" stop-color="#0ea5e9"/>
      <stop offset="70%" stop-color="#0b5c9e"/>
      <stop offset="100%" stop-color="#041f38"/>
    </linearGradient>
    <linearGradient id="penGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="nibSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <g filter="url(#penShadow)" transform="rotate(-45 60 60)">
    <!-- Corpo da Caneta -->
    <rect x="52" y="32" width="16" height="52" rx="4" fill="url(#bodyBlue)"/>
    
    <!-- Anel Dourado Superior -->
    <rect x="51" y="28" width="18" height="5" rx="1.5" fill="url(#penGold)"/>
    
    <!-- Tampa / Topo -->
    <path d="M52 28 C52 20 68 20 68 28 Z" fill="url(#bodyBlue)"/>
    <circle cx="60" cy="20" r="3" fill="url(#penGold)"/>

    <!-- Clip Dourado Metálico 3D -->
    <path d="M64 24 L64 54 Q64 58 61 58" stroke="url(#penGold)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="61" cy="58" r="2.5" fill="url(#penGold)"/>

    <!-- Anel Dourado Inferior (Grip) -->
    <rect x="51" y="83" width="18" height="6" rx="1" fill="url(#penGold)"/>
    
    <!-- Empunhadura de escrita -->
    <polygon points="53,89 67,89 64,98 56,98" fill="#1e293b"/>

    <!-- Pena / Ponta Dourada da Caneta Tinteiro (Nib) -->
    <polygon points="56,98 64,98 60,112" fill="url(#penGold)"/>
    <polygon points="58,98 62,98 60,106" fill="url(#nibSilver)"/>
    <!-- Linha central da pena -->
    <line x1="60" y1="98" x2="60" y2="110" stroke="#451a03" stroke-width="0.8"/>
    <circle cx="60" cy="103" r="0.8" fill="#451a03"/>
    
    <!-- Reflexo de Luz 3D no corpo -->
    <line x1="56" y1="34" x2="56" y2="82" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  </g>
</svg>
