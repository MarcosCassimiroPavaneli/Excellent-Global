<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra 3D -->
    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="lensGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <g filter="url(#shadow3d)" transform="rotate(-12 60 60)">
    <!-- Hastes dos óculos (perspectiva 3D) -->
    <path d="M22 52 Q 10 35 18 20" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M98 52 Q 110 35 102 20" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Pontas das hastes em dourado -->
    <circle cx="18" cy="20" r="3" fill="url(#goldAccent)"/>
    <circle cx="102" cy="20" r="3" fill="url(#goldAccent)"/>

    <!-- Lente Esquerda -->
    <rect x="18" y="42" width="36" height="30" rx="12" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="4.5"/>
    <!-- Reflexo Lente Esquerda -->
    <path d="M22 46 Q 32 44 48 50" stroke="url(#lensGlow)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="26" cy="62" rx="4" ry="2" fill="#ffffff" opacity="0.6" transform="rotate(-30 26 62)"/>

    <!-- Lente Direita -->
    <rect x="66" y="42" width="36" height="30" rx="12" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="4.5"/>
    <!-- Reflexo Lente Direita -->
    <path d="M70 46 Q 80 44 96 50" stroke="url(#lensGlow)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="74" cy="62" rx="4" ry="2" fill="#ffffff" opacity="0.6" transform="rotate(-30 74 62)"/>

    <!-- Ponte Central (Nasal) Dourada -->
    <path d="M54 50 Q 60 46 66 50" stroke="url(#goldAccent)" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Detalhes metálicos nas pontas -->
    <circle cx="19" cy="46" r="2" fill="url(#goldAccent)"/>
    <circle cx="101" cy="46" r="2" fill="url(#goldAccent)"/>
  </g>
</svg>
