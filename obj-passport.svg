<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="passShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="passCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073660"/>
      <stop offset="60%" stop-color="#0b5c9e"/>
      <stop offset="100%" stop-color="#052442"/>
    </linearGradient>
    <linearGradient id="passGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <g filter="url(#passShadow)" transform="rotate(-15 60 60)">
    <!-- Cartão de Embarque saindo por trás do passaporte -->
    <g transform="rotate(20 60 60)">
      <rect x="52" y="16" width="34" height="65" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="56" y1="26" x2="82" y2="26" stroke="#0284c7" stroke-width="2.5"/>
      <line x1="56" y1="32" x2="75" y2="32" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Código de barras simulado -->
      <line x1="56" y1="40" x2="56" y2="48" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="59" y1="40" x2="59" y2="48" stroke="#1e293b" stroke-width="2"/>
      <line x1="63" y1="40" x2="63" y2="48" stroke="#1e293b" stroke-width="1"/>
      <line x1="66" y1="40" x2="66" y2="48" stroke="#1e293b" stroke-width="3"/>
      <line x1="71" y1="40" x2="71" y2="48" stroke="#1e293b" stroke-width="1"/>
      <line x1="74" y1="40" x2="74" y2="48" stroke="#1e293b" stroke-width="2"/>
    </g>

    <!-- Livreto do Passaporte (Capa Azul Marinho) -->
    <rect x="26" y="24" width="52" height="74" rx="6" fill="url(#passCover)" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Lombada Dourada à esquerda -->
    <line x1="28" y1="26" x2="28" y2="96" stroke="url(#passGold)" stroke-width="1.5"/>

    <!-- Emblema do Globo Dourado no Passaporte -->
    <circle cx="52" cy="54" r="14" fill="none" stroke="url(#passGold)" stroke-width="1.8"/>
    <ellipse cx="52" cy="54" rx="7" ry="14" fill="none" stroke="url(#passGold)" stroke-width="1.2"/>
    <line x1="38" y1="54" x2="66" y2="54" stroke="url(#passGold)" stroke-width="1.2"/>
    <line x1="41" y1="47" x2="63" y2="47" stroke="url(#passGold)" stroke-width="1"/>
    <line x1="41" y1="61" x2="63" y2="61" stroke="url(#passGold)" stroke-width="1"/>

    <!-- Texto / Título Dourado Simulado -->
    <rect x="36" y="32" width="32" height="3" rx="1" fill="url(#passGold)"/>
    <rect x="42" y="38" width="20" height="2" rx="1" fill="url(#passGold)"/>
    
    <!-- Símbolo Biométrico Dourado no Rodapé -->
    <rect x="44" y="80" width="16" height="8" rx="2" fill="none" stroke="url(#passGold)" stroke-width="1.2"/>
    <line x1="40" y1="84" x2="64" y2="84" stroke="url(#passGold)" stroke-width="1.2"/>
    <circle cx="52" cy="84" r="2.5" fill="url(#passGold)"/>
  </g>
</svg>
