<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="bookShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="coverBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5c9e"/>
      <stop offset="100%" stop-color="#052442"/>
    </linearGradient>
    <linearGradient id="pagesLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pagesRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <g filter="url(#bookShadow)" transform="rotate(-8 60 60)">
    <!-- Capa Dura Inferior do Livro (Perspectiva 3D) -->
    <path d="M14 62 Q 60 76 106 62 L 108 72 Q 60 86 12 72 Z" fill="url(#coverBlue)"/>
    
    <!-- Bloco de Folhas (Espessura das Páginas 3D) -->
    <path d="M16 58 Q 60 72 104 58 L 106 68 Q 60 82 14 68 Z" fill="#94a3b8"/>
    
    <!-- Página Esquerda Aberta 3D Curvada -->
    <path d="M16 58 Q 38 48 60 56 L 60 76 Q 38 68 16 78 Z" fill="url(#pagesLeft)"/>
    <!-- Linhas de texto simuladas na página esquerda -->
    <path d="M22 60 Q 36 54 54 59" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M22 64 Q 36 58 54 63" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M22 68 Q 36 62 54 67" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M22 72 Q 36 66 50 71" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Página Direita Aberta 3D Curvada -->
    <path d="M60 56 Q 82 48 104 58 L 104 78 Q 82 68 60 76 Z" fill="url(#pagesRight)"/>
    <!-- Linhas de texto simuladas na página direita -->
    <path d="M66 59 Q 84 54 98 60" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M66 63 Q 84 58 98 64" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M66 67 Q 84 62 98 68" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M66 71 Q 84 66 94 72" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Lombada Central Sombreada -->
    <line x1="60" y1="56" x2="60" y2="76" stroke="#475569" stroke-width="2"/>

    <!-- Fita Marcadora Dourada (Bookmark Ribbon) caindo com corte em V -->
    <path d="M60 54 Q 63 68 58 88 L 62 94 L 66 88 Q 63 68 60 54 Z" fill="url(#ribbonGold)"/>
  </g>
</svg>
