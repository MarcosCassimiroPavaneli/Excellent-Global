<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="packShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="packAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="packBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="zipSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <g filter="url(#packShadow)" transform="rotate(10 60 60)">
    <!-- Alça Superior da Mochila -->
    <path d="M48 28 Q 60 14 72 28" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Corpo Principal da Mochila 3D -->
    <rect x="32" y="26" width="56" height="68" rx="20" fill="url(#packBlue)"/>
    
    <!-- Zíper Principal Superior -->
    <path d="M36 38 Q 60 30 84 38" stroke="url(#zipSilver)" stroke-width="3" stroke-dasharray="2 2" fill="none"/>

    <!-- Bolso Frontal 3D -->
    <rect x="38" y="52" width="44" height="38" rx="12" fill="url(#packAmber)"/>
    
    <!-- Zíper do Bolso Frontal -->
    <path d="M42 58 L 78 58" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 1.5"/>
    <!-- Puxador do zíper -->
    <rect x="68" y="57" width="5" height="7" rx="1.5" fill="#1e293b"/>

    <!-- Detalhe decorativo fivela / logo do bolso -->
    <circle cx="60" cy="74" r="5" fill="#ffffff" opacity="0.8"/>
    <path d="M57 74 L 60 71 L 63 74" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Bolsos Laterais para Garrafa -->
    <rect x="27" y="58" width="6" height="24" rx="3" fill="#075985"/>
    <rect x="87" y="58" width="6" height="24" rx="3" fill="#075985"/>

    <!-- Costura inferior e base -->
    <path d="M36 88 Q 60 94 84 88" stroke="#041f38" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
